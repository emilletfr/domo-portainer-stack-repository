services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: eclipse-mosquitto-2.0.22
    restart: unless-stopped
    volumes:
      - /home/pi/Documents/domo-server-persist/mosquitto-data:/mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    command: "mosquitto -c /mosquitto-no-auth.conf"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.3
    container_name: zigbee2mqtt-2.14.3
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - /home/pi/Documents/domo-server-persist/zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - 8081:8080
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        
  node-red:
    image: nodered/node-red:5.0.9
    container_name: node-red-5.0.9
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - /home/pi/Documents/domo-server-persist/node-red-data:/data
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
  #  node-red-contrib-debounce@0.0.2
  #  node-red-contrib-homekit-bridged@1.7.3
  #  node-red-contrib-melcloud@1.6.0
  #  node-red-contrib-moment@5.0.0
  #  node-red-dashboard@3.6.5
  #  node-red-node-ping@0.3.3
  
  # Pont poêle à granulés Cadel Luce Plus 9 (app Easy Connect Plus / Micronova Agua IOT) -> MQTT
  # La configuration (email + mot de passe) est dans le fichier hôte :
  #   /home/pi/Documents/domo-server-persist/micronova2mqtt-data/micronova2mqtt.yml
  # Image construite localement sur le Pi (l'image Docker Hub n'existe qu'en amd64) :
  #   git clone https://github.com/Legobas/micronova2mqtt.git && docker build -t micronova2mqtt:1.39.0 .
  micronova2mqtt:
    image: micronova2mqtt:1.39.0
    pull_policy: never
    container_name: micronova2mqtt-1.39.0
    restart: unless-stopped
    depends_on:
      - mqtt
    # platform: linux/amd64   # à décommenter uniquement si vous utilisez l'image Docker Hub via QEMU
    environment:
      LOGLEVEL: info
      TZ: Europe/Paris
    volumes:
      - /home/pi/Documents/domo-server-persist/micronova2mqtt-data:/data:rw
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        
  netdata:
    image: netdata/netdata:v2.12.3
    container_name: netdata-2.12.3
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        
  bwalink:
    image: ghcr.io/emilletfr/bwalink:latest
    container_name: bwalink
    restart: unless-stopped
    environment:
      # See @url:`https://iotbyhvm.ooo/using-uris-to-connect-to-a-mqtt-server/` for MQTT_URI format
      # MQTT_URI *must* be properly URI encoded, e.g. mqtt://username:pa##word@10.1.10.2 would
      # be mqtt://username:***@10.1.10.2
      # BRIDGE_IP and BRIDGE_PORT are the address and port for your serial to IP device or
      # host running ser2net, socat or ESPEasy serial server
      MQTT_URI: mqtt://192.168.8.10
      BRIDGE_IP: 192.168.8.11
      BRIDGE_PORT: 8899
      TZ: Europe/Paris
      LOG_LEVEL: WARN # Any of FATAL, ERROR, WARN, INFO or DEBUG
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        
volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
